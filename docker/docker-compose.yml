version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: zhangshi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/zhangshi.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WECHAT_MINI_APPID: ${WECHAT_MINI_APPID:-}
      WECHAT_MINI_SECRET: ${WECHAT_MINI_SECRET:-}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      WECHAT_MP_TOKEN: ${WECHAT_MP_TOKEN:-}
      WECHAT_MP_AES_KEY: ${WECHAT_MP_AES_KEY:-}
    volumes:
      - backend_data:/data
    networks:
      - zhangshi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ../admin
      dockerfile: ../docker/Dockerfile.admin
    container_name: zhangshi-admin
    restart: unless-stopped
    networks:
      - zhangshi-net

  nginx:
    image: nginx:alpine
    container_name: zhangshi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - backend
      - admin
    networks:
      - zhangshi-net

volumes:
  backend_data:
  certbot_www:
  certbot_conf:

networks:
  zhangshi-net:
    driver: bridge
